services:
  db:
    image: pgvector/pgvector:pg16
    container_name: enterprise-it-support-agent-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: enterprise_it_support_agent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d enterprise_it_support_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
